name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # expo-mcp-bridge is installed from its repo so CI works before/without an npm release
      - run: git clone --depth 1 https://github.com/Rudrasamadhiya/expo-mcp-bridge ../expo-mcp-bridge
      - run: npm install --no-save ../expo-mcp-bridge
      - run: npm test
      - run: npm pack --dry-run
